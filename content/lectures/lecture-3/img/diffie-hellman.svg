<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460">
  <title>Diffie-Hellman with toy numbers: p=23, g=5, shared secret 2</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .title { font-size: 22px; font-weight: bold; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .cell { fill: none; stroke: #5d6573; stroke-width: 1; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .plain { fill: none; stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text class="orange title" x="150" y="30">Alice</text>
  <text class="cyan title" x="745" y="30">Bob</text>
  <text class="red" x="450" y="30">the network — Eve sees all of it</text>
  <rect x="300" y="52" width="300" height="300" rx="10" class="dash" style="stroke: #ff5252" />
  <rect class="box" x="340" y="70" width="220" height="44" rx="6" style="stroke: #cfd3da" />
  <text class="mono" x="450" y="92">p = 23,  g = 5</text>
  <text class="small" x="450" y="132">agreed in public</text>
  <rect class="box" x="55" y="70" width="190" height="44" rx="6" style="stroke: #ff9100" />
  <text class="violet mono" x="150" y="92">secret a = 6</text>
  <rect class="box" x="650" y="70" width="190" height="44" rx="6" style="stroke: #00e5ff" />
  <text class="violet mono" x="745" y="92">secret b = 15</text>
  <text class="orange mono" x="150" y="172">A = 5⁶ mod 23 = 8</text>
  <text class="cyan mono" x="745" y="172">B = 5¹⁵ mod 23 = 19</text>
  <path class="line" d="M210,205 H685" style="stroke: #ff9100" />
  <text class="orange mono" x="450" y="192">A = 8</text>
  <path class="line" d="M685,250 H210" style="stroke: #00e5ff" />
  <text class="cyan mono" x="450" y="237">B = 19</text>
  <text class="mono" x="150" y="300">19⁶ mod 23</text>
  <text class="mono" x="745" y="300">8¹⁵ mod 23</text>
  <rect class="box" x="90" y="318" width="120" height="44" rx="6" style="stroke: #76ff03" />
  <text class="green mono" x="150" y="340">s = 2</text>
  <rect class="box" x="685" y="318" width="120" height="44" rx="6" style="stroke: #76ff03" />
  <text class="green mono" x="745" y="340">s = 2</text>
  <text class="red" x="450" y="300">Eve has 23, 5, 8, 19</text>
  <text class="small" x="450" y="328">to get 2 she needs a or b</text>
  <text class="yellow" x="450" y="400">same s on both sides, never sent — finding a from 8 is the discrete log</text>
  <text class="small" x="450" y="432">real p is 2048+ bits, or the curve X25519 — the same three steps</text>
</svg>
