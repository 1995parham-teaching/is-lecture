<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <title>Forward secrecy: a leaked long-term key against recorded sessions</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .title { font-size: 22px; font-weight: bold; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .cell { fill: none; stroke: #5d6573; stroke-width: 1; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .plain { fill: none; stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <!-- Row 1: static RSA -->
  <text class="red title" x="40" y="25" style="text-anchor: start">Static RSA key exchange</text>
  <path class="line" d="M40,95 H860" />
  <rect class="box" x="60" y="55" width="120" height="30" rx="6" />
  <text class="small" x="120" y="70">session 1</text>
  <text class="red mono" x="120" y="115" style="font-size: 14px">Enc(pk, k₁)</text>
  <rect class="box" x="200" y="55" width="120" height="30" rx="6" />
  <text class="small" x="260" y="70">session 2</text>
  <text class="red mono" x="260" y="115" style="font-size: 14px">Enc(pk, k₂)</text>
  <rect class="box" x="340" y="55" width="120" height="30" rx="6" />
  <text class="small" x="400" y="70">session 3</text>
  <text class="red mono" x="400" y="115" style="font-size: 14px">Enc(pk, k₃)</text>
  <circle cx="620" cy="95" r="14" style="fill: #ff5252" />
  <text x="620" y="96" style="font-weight: bold">!</text>
  <text class="red" x="620" y="62" style="font-size: 17px">private key sk leaks</text>

  <rect class="box" x="30" y="145" width="320" height="44" rx="6" />
  <text x="190" y="167" style="font-size: 16px">recorded: <tspan class="mono" style="font-size: 14px">Enc(pk, kᵢ)</tspan></text>
  <path class="line" d="M350,167 H378" />
  <rect class="box" x="380" y="145" width="130" height="44" rx="6" style="stroke: #ff5252" />
  <text class="red" x="445" y="167" style="font-size: 16px">+ leaked sk</text>
  <path class="line" d="M510,167 H548" />
  <rect class="box" x="550" y="145" width="310" height="44" rx="6" style="stroke: #ff5252" />
  <text class="red" x="705" y="167" style="font-size: 16px">Dec(sk, ·) → every kᵢ → every session</text>

  <!-- Row 2: ephemeral DH -->
  <text class="green title" x="40" y="245" style="text-anchor: start">Ephemeral Diffie–Hellman, signed</text>
  <path class="line" d="M40,315 H860" />
  <rect class="box" x="60" y="275" width="120" height="30" rx="6" />
  <text class="small" x="120" y="290">session 1</text>
  <text class="green" x="120" y="335" style="font-size: 14px">a, b deleted</text>
  <rect class="box" x="200" y="275" width="120" height="30" rx="6" />
  <text class="small" x="260" y="290">session 2</text>
  <text class="green" x="260" y="335" style="font-size: 14px">a, b deleted</text>
  <rect class="box" x="340" y="275" width="120" height="30" rx="6" />
  <text class="small" x="400" y="290">session 3</text>
  <text class="green" x="400" y="335" style="font-size: 14px">a, b deleted</text>
  <circle cx="620" cy="315" r="14" style="fill: #ff5252" />
  <text x="620" y="316" style="font-weight: bold">!</text>
  <text class="red" x="620" y="282" style="font-size: 17px">private key sk leaks</text>

  <rect class="box" x="30" y="365" width="320" height="44" rx="6" />
  <text x="190" y="387" style="font-size: 16px">recorded: <tspan class="mono" style="font-size: 14px">gᵃ, gᵇ, Sig(sk, gᵃ‖gᵇ)</tspan></text>
  <path class="line" d="M350,387 H378" />
  <rect class="box" x="380" y="365" width="130" height="44" rx="6" style="stroke: #ff5252" />
  <text class="red" x="445" y="387" style="font-size: 16px">+ leaked sk</text>
  <path class="line" d="M510,387 H548" />
  <rect class="box" x="550" y="365" width="310" height="44" rx="6" style="stroke: #76ff03" />
  <text class="green" x="705" y="387" style="font-size: 16px">k from gᵃᵇ needs a or b — both gone</text>

  <text class="orange" x="450" y="448" style="font-size: 17px">what sk still buys: signing as the server in <tspan font-style="italic">future</tspan> sessions, until it is revoked</text>
  <text class="small" x="450" y="490">in both rows the attacker recorded every session, from day one</text>
</svg>
