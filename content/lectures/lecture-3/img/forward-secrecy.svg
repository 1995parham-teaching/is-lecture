<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <title>Forward secrecy: a leaked long-term key against recorded sessions</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .title { font-size: 22px; font-weight: bold; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .cell { fill: none; stroke: #5d6573; stroke-width: 1; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .plain { fill: none; stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text class="red title" x="40" y="35" style="text-anchor: start">Static RSA key exchange</text>
  <path class="line" d="M40,120 H860" />
  <rect class="box" x="80" y="76" width="110" height="34" rx="6" style="stroke: #cfd3da" />
  <text class="small" x="135" y="93">session 1</text>
  <text class="red" x="135" y="142" style="font-size: 15px">key under RSA</text>
  <rect class="box" x="220" y="76" width="110" height="34" rx="6" style="stroke: #cfd3da" />
  <text class="small" x="275" y="93">session 2</text>
  <text class="red" x="275" y="142" style="font-size: 15px">key under RSA</text>
  <rect class="box" x="360" y="76" width="110" height="34" rx="6" style="stroke: #cfd3da" />
  <text class="small" x="415" y="93">session 3</text>
  <text class="red" x="415" y="142" style="font-size: 15px">key under RSA</text>
  <circle cx="620" cy="120" r="14" style="fill: #ff5252" />
  <text x="620" y="121" style="font-weight: bold">!</text>
  <text class="red" x="620" y="88" style="font-size: 17px">private key leaks</text>
  <text class="red" x="760" y="154" style="font-size: 18px">every session decrypts</text>
  <path class="line" d="M606,130 C560,180 200,190 135,158" style="stroke: #ff5252; stroke-dasharray: 6 5" />
  <text class="green title" x="40" y="215" style="text-anchor: start">Ephemeral Diffie–Hellman, signed</text>
  <path class="line" d="M40,300 H860" />
  <rect class="box" x="80" y="256" width="110" height="34" rx="6" style="stroke: #cfd3da" />
  <text class="small" x="135" y="273">session 1</text>
  <text class="green" x="135" y="322" style="font-size: 15px">key deleted</text>
  <rect class="box" x="220" y="256" width="110" height="34" rx="6" style="stroke: #cfd3da" />
  <text class="small" x="275" y="273">session 2</text>
  <text class="green" x="275" y="322" style="font-size: 15px">key deleted</text>
  <rect class="box" x="360" y="256" width="110" height="34" rx="6" style="stroke: #cfd3da" />
  <text class="small" x="415" y="273">session 3</text>
  <text class="green" x="415" y="322" style="font-size: 15px">key deleted</text>
  <circle cx="620" cy="300" r="14" style="fill: #ff5252" />
  <text x="620" y="301" style="font-weight: bold">!</text>
  <text class="red" x="620" y="268" style="font-size: 17px">private key leaks</text>
  <text class="green" x="760" y="334" style="font-size: 18px">nothing to decrypt</text>
  <text class="small" x="450" y="412">in both rows the attacker recorded every session, from day one</text>
  <text class="yellow" x="450" y="375">the long-term key should only sign — then it can never unlock the past</text>
</svg>
