<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <title>Length extension: resuming SHA-256 from a published H(K || m)</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .label { font-size: 16px; fill: #b0b4bc; text-anchor: start; }
    .title { font-size: 22px; font-weight: bold; }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .cell { fill: none; stroke: #5d6573; stroke-width: 1; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .plain { fill: none; stroke: #cfd3da; stroke-width: 2; }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text class="label" x="20" y="160">server, holds K</text>
  <rect class="box" x="40" y="86" width="90" height="48" rx="6" style="stroke: #cfd3da" />
  <text class="mono" x="85" y="110">IV</text>
  <rect class="box" x="225" y="10" width="150" height="44" rx="6" style="stroke: #ff9100" />
  <text class="orange mono" x="300" y="32">K ‖ m</text>
  <circle cx="300" cy="110" r="26" class="box" />
  <text x="300" y="110">f</text>
  <path class="line" d="M132,110 H272" />
  <path class="line" d="M300,56 V82" />
  <rect class="box" x="430" y="86" width="250" height="48" rx="6" style="stroke: #ffcc00" />
  <text class="yellow mono" x="555" y="110">tag = H(K ‖ m)</text>
  <path class="line" d="M328,110 H428" />
  <text class="small" x="790" y="110">sent to the client</text>
  <text class="label" x="20" y="230">attacker, no K</text>
  <text class="small" x="612" y="172" style="text-anchor: start">the tag is the full internal state</text>
  <circle cx="555" cy="270" r="26" class="box" style="stroke: #ff5252" />
  <text x="555" y="270">f</text>
  <path class="line" d="M555,136 V242" style="stroke: #ff5252" />
  <rect class="box" x="260" y="248" width="200" height="44" rx="6" style="stroke: #ff5252" />
  <text class="red mono" x="360" y="270">pad ‖ extra</text>
  <path class="line" d="M462,270 H527" style="stroke: #ff5252" />
  <rect class="box" x="260" y="330" width="540" height="48" rx="6" style="stroke: #76ff03" />
  <text class="green mono" x="530" y="354">H(K ‖ m ‖ pad ‖ extra) — a valid tag</text>
  <path class="line" d="M555,298 V328" style="stroke: #ff5252" />
  <text class="yellow" x="450" y="420">HMAC hashes that result again under the key — the outer hash hides the state</text>
</svg>
