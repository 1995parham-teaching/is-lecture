<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520">
  <title>CBC and CTR modes, three blocks each</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .title { font-size: 22px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text class="yellow title" x="45" y="30">CBC</text>
  <text class="violet" x="130" y="90">IV</text>
  <path class="line" d="M150,90 H244" />
  <text class="orange" x="260" y="35">P1</text>
  <path class="line" d="M260,50 V74" />
  <circle cx="260" cy="90" r="14" class="box" /><path d="M252,90 H268 M260,82 V98" stroke="#cfd3da" stroke-width="2" />
  <path class="line" d="M260,104 V118" />
  <rect class="box" x="205" y="120" width="110" height="50" rx="6" />
  <text x="260" y="145">AES(<tspan class="cyan">K</tspan>)</text>
  <path class="line" d="M260,170 V200" />
  <text class="green" x="260" y="218">C1</text>
  <circle cx="260" cy="185" r="4" fill="#cfd3da" />
  <path class="line" d="M260,185 H375 V90 H474" />
  <text class="orange" x="490" y="35">P2</text>
  <path class="line" d="M490,50 V74" />
  <circle cx="490" cy="90" r="14" class="box" /><path d="M482,90 H498 M490,82 V98" stroke="#cfd3da" stroke-width="2" />
  <path class="line" d="M490,104 V118" />
  <rect class="box" x="435" y="120" width="110" height="50" rx="6" />
  <text x="490" y="145">AES(<tspan class="cyan">K</tspan>)</text>
  <path class="line" d="M490,170 V200" />
  <text class="green" x="490" y="218">C2</text>
  <circle cx="490" cy="185" r="4" fill="#cfd3da" />
  <path class="line" d="M490,185 H605 V90 H704" />
  <text class="orange" x="720" y="35">P3</text>
  <path class="line" d="M720,50 V74" />
  <circle cx="720" cy="90" r="14" class="box" /><path d="M712,90 H728 M720,82 V98" stroke="#cfd3da" stroke-width="2" />
  <path class="line" d="M720,104 V118" />
  <rect class="box" x="665" y="120" width="110" height="50" rx="6" />
  <text x="720" y="145">AES(<tspan class="cyan">K</tspan>)</text>
  <path class="line" d="M720,170 V200" />
  <text class="green" x="720" y="218">C3</text>
  <text class="small" x="75" y="165">each block</text>
  <text class="small" x="75" y="187">waits for the last</text>

  <path class="dash" d="M20,250 H880" />

  <text class="green title" x="45" y="290">CTR</text>
  <rect class="box" x="190" y="275" width="140" height="40" rx="6" style="stroke: #00e5ff" />
  <text x="260" y="295">nonce ‖ 1</text>
  <path class="line" d="M260,315 V338" />
  <rect class="box" x="205" y="340" width="110" height="50" rx="6" />
  <text x="260" y="365">AES(<tspan class="cyan">K</tspan>)</text>
  <path class="line" d="M260,390 V424" />
  <circle cx="260" cy="440" r="14" class="box" /><path d="M252,440 H268 M260,432 V448" stroke="#cfd3da" stroke-width="2" />
  <text class="orange" x="175" y="440">P1</text>
  <path class="line" d="M192,440 H242" />
  <path class="line" d="M260,454 V478" />
  <text class="green" x="260" y="498">C1</text>
  <rect class="box" x="420" y="275" width="140" height="40" rx="6" style="stroke: #00e5ff" />
  <text x="490" y="295">nonce ‖ 2</text>
  <path class="line" d="M490,315 V338" />
  <rect class="box" x="435" y="340" width="110" height="50" rx="6" />
  <text x="490" y="365">AES(<tspan class="cyan">K</tspan>)</text>
  <path class="line" d="M490,390 V424" />
  <circle cx="490" cy="440" r="14" class="box" /><path d="M482,440 H498 M490,432 V448" stroke="#cfd3da" stroke-width="2" />
  <text class="orange" x="405" y="440">P2</text>
  <path class="line" d="M422,440 H472" />
  <path class="line" d="M490,454 V478" />
  <text class="green" x="490" y="498">C2</text>
  <rect class="box" x="650" y="275" width="140" height="40" rx="6" style="stroke: #00e5ff" />
  <text x="720" y="295">nonce ‖ 3</text>
  <path class="line" d="M720,315 V338" />
  <rect class="box" x="665" y="340" width="110" height="50" rx="6" />
  <text x="720" y="365">AES(<tspan class="cyan">K</tspan>)</text>
  <path class="line" d="M720,390 V424" />
  <circle cx="720" cy="440" r="14" class="box" /><path d="M712,440 H728 M720,432 V448" stroke="#cfd3da" stroke-width="2" />
  <text class="orange" x="635" y="440">P3</text>
  <path class="line" d="M652,440 H702" />
  <path class="line" d="M720,454 V478" />
  <text class="green" x="720" y="498">C3</text>
  <text class="small" x="318" y="407">keystream</text>
  <text class="small" x="75" y="385">AES never</text>
  <text class="small" x="75" y="407">sees the data</text>
</svg>
