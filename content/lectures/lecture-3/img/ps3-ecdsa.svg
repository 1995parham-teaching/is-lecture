<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
  <title>ECDSA with a repeated nonce gives up the private key</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .title { font-size: 22px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text x="450" y="22" style="fill: #b0b4bc">ECDSA: s = k⁻¹ (e + d·r) mod n — hash e, private key d, nonce k, r from k·G</text>

  <rect class="box" x="40" y="50" width="380" height="60" rx="6" />
  <text x="230" y="80">program 1: <tspan class="orange">e1</tspan>  →  (<tspan class="red">r</tspan>, <tspan class="cyan">s1</tspan>)</text>
  <rect class="box" x="480" y="50" width="380" height="60" rx="6" />
  <text x="670" y="80">program 2: <tspan class="orange">e2</tspan>  →  (<tspan class="red">r</tspan>, <tspan class="cyan">s2</tspan>)</text>
  <text class="red" x="450" y="140">same k every time, so the same r in every signature — and anyone can see it</text>

  <path class="line" d="M450,160 V188" />
  <rect class="box" x="150" y="192" width="600" height="120" rx="6" style="stroke: #ffcc00" />
  <text x="450" y="222" style="font-size: 22px"><tspan class="cyan">s1 − s2</tspan> = k⁻¹ (<tspan class="orange">e1 − e2</tspan>)   — d·r cancels</text>
  <text x="450" y="256" style="font-size: 22px">k = (<tspan class="orange">e1 − e2</tspan>) / (<tspan class="cyan">s1 − s2</tspan>)</text>
  <text x="450" y="290" style="font-size: 22px"><tspan class="red">d</tspan> = (<tspan class="cyan">s1</tspan>·k − <tspan class="orange">e1</tspan>) / <tspan class="red">r</tspan></text>

  <text class="yellow" x="450" y="350">two public signatures, two divisions — Sony's private signing key</text>
</svg>
