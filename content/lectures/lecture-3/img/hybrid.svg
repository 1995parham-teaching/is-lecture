<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <title>Hybrid encryption</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .title { font-size: 22px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="10" y="60" width="190" height="60" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="105" y="90" style="font-size: 18px">message, any size</text>
  <rect class="box" x="10" y="250" width="190" height="60" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="105" y="280" style="font-size: 18px">fresh random key k</text>

  <path class="line" d="M200,90 H256" />
  <path class="line" d="M105,250 L290,123" />
  <rect class="box" x="260" y="60" width="160" height="60" rx="6" />
  <text x="340" y="90">AES-GCM</text>
  <text class="small" x="340" y="40">fast, does the bulk</text>

  <path class="line" d="M200,280 H256" />
  <rect class="box" x="260" y="250" width="160" height="60" rx="6" />
  <text x="340" y="272">Encrypt to</text>
  <text class="green" x="340" y="294" style="font-size: 18px">Bob's public key</text>
  <text class="small" x="340" y="330">slow, but only 16–32 bytes</text>

  <path class="line" d="M420,90 H476" />
  <rect class="box" x="480" y="60" width="170" height="60" rx="6" style="stroke: #76ff03" />
  <text class="green" x="565" y="90">ciphertext</text>
  <path class="line" d="M420,280 H476" />
  <rect class="box" x="480" y="250" width="170" height="60" rx="6" style="stroke: #76ff03" />
  <text class="green" x="565" y="280">wrapped k</text>

  <path class="line" d="M650,90 H700 L725,150" />
  <path class="line" d="M650,280 H700 L725,222" />
  <rect class="box" x="720" y="140" width="165" height="92" rx="6" />
  <text x="802" y="162">Bob</text>
  <text class="small" x="802" y="188"><tspan class="red">private key</tspan> → k</text>
  <text class="small" x="802" y="212">k → message</text>
  <text class="small" x="450" y="385">TLS, PGP, Signal, disk encryption: all this shape</text>
</svg>
