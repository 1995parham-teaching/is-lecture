<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370">
  <title>Flame: one MD5 signature, two certificates</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .title { font-size: 22px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="20" y="30" width="330" height="100" rx="6" style="stroke: #76ff03" />
  <text class="green title" x="185" y="56">A — what the CA signed</text>
  <text x="185" y="86">a licensing certificate</text>
  <text class="small" x="185" y="112">prefix A ‖ collision blocks</text>

  <rect class="box" x="20" y="200" width="330" height="100" rx="6" style="stroke: #ff5252" />
  <text class="red title" x="185" y="226">B — what Flame carried</text>
  <text x="185" y="256">signs code as Microsoft</text>
  <text class="small" x="185" y="282">prefix B ‖ collision blocks</text>

  <path class="line" d="M350,80 L436,150" />
  <path class="line" d="M350,250 L436,180" />
  <rect class="box" x="440" y="135" width="90" height="60" rx="6" />
  <text x="485" y="165">MD5</text>
  <path class="line" d="M530,165 H576" />
  <rect class="box" x="580" y="135" width="140" height="60" rx="6" style="stroke: #ffcc00" />
  <text class="yellow" x="650" y="165">one digest</text>
  <path class="line" d="M720,165 H756" />
  <rect class="box" x="760" y="135" width="120" height="60" rx="6" style="stroke: #ee82ee" />
  <text class="violet" x="820" y="165">CA's sig</text>
  <text class="small" x="820" y="110">Microsoft TSLS CA</text>

  <path class="dash" d="M820,195 V250 H356" style="stroke: #ee82ee" />
  <text class="violet" x="600" y="236">copied onto B, still valid</text>

  <text class="yellow" x="450" y="340">the CA never saw B — a signature covers the digest, not the document</text>
</svg>
