<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360">
  <title>Nonce reuse: the keystream cancels out</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .title { font-size: 22px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="60" y="40" width="110" height="56" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="115" y="68">P1</text>
  <text class="title" x="210" y="68">⊕</text>
  <rect class="box" x="250" y="40" width="110" height="56" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="305" y="68">keystream</text>
  <text class="title" x="400" y="68">=</text>
  <rect class="box" x="440" y="40" width="110" height="56" rx="6" style="stroke: #76ff03" />
  <text class="green" x="495" y="68">C1</text>

  <rect class="box" x="60" y="130" width="110" height="56" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="115" y="158">P2</text>
  <text class="title" x="210" y="158">⊕</text>
  <rect class="box" x="250" y="130" width="110" height="56" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="305" y="158">keystream</text>
  <text class="title" x="400" y="158">=</text>
  <rect class="box" x="440" y="130" width="110" height="56" rx="6" style="stroke: #76ff03" />
  <text class="green" x="495" y="158">C2</text>

  <rect x="238" y="28" width="134" height="170" rx="10" class="dash" style="stroke: #ff5252" />
  <path class="line" d="M590,113 H384" style="stroke: #ff5252" />
  <text class="red" x="730" y="100">same K, same nonce:</text>
  <text class="red" x="730" y="126">the same keystream</text>

  <path class="line" d="M495,186 V236" />
  <text x="450" y="268" style="font-size: 24px"><tspan class="green">C1 ⊕ C2</tspan>  =  P1 ⊕ <tspan class="cyan">ks</tspan> ⊕ P2 ⊕ <tspan class="cyan">ks</tspan>  =  <tspan class="orange">P1 ⊕ P2</tspan></text>
  <text class="yellow" x="450" y="320">the key has cancelled out — guess one message and you read the other</text>
</svg>
