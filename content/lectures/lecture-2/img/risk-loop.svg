<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340">
  <title>The risk management loop: identify, analyse, evaluate, treat, monitor</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
    .title { font-size: 22px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="10" y="40" width="160" height="120" rx="6" style="stroke: #ff9100" />
  <text class="orange title" x="90" y="70">Identify</text>
  <text class="small" x="90" y="105">assets, threats,</text>
  <text class="small" x="90" y="128">vulnerabilities</text>

  <rect class="box" x="190" y="40" width="160" height="120" rx="6" style="stroke: #ffcc00" />
  <text class="yellow title" x="270" y="70">Analyse</text>
  <text class="small" x="270" y="105">how likely?</text>
  <text class="small" x="270" y="128">how bad?</text>

  <rect class="box" x="370" y="40" width="160" height="120" rx="6" style="stroke: #ff5252" />
  <text class="red title" x="450" y="70">Evaluate</text>
  <text class="small" x="450" y="105">above the</text>
  <text class="small" x="450" y="128">appetite?</text>

  <rect class="box" x="550" y="40" width="160" height="120" rx="6" style="stroke: #76ff03" />
  <text class="green title" x="630" y="70">Treat</text>
  <text class="small" x="630" y="105">avoid · reduce</text>
  <text class="small" x="630" y="128">transfer · accept</text>

  <rect class="box" x="730" y="40" width="160" height="120" rx="6" style="stroke: #00e5ff" />
  <text class="cyan title" x="810" y="70">Monitor</text>
  <text class="small" x="810" y="105">the inputs</text>
  <text class="small" x="810" y="128">move</text>

  <path class="line" d="M170,100 L188,100" />
  <path class="line" d="M350,100 L368,100" />
  <path class="line" d="M530,100 L548,100" />
  <path class="line" d="M710,100 L728,100" />
  <path class="dash" d="M810,160 L810,215 L90,215 L90,162" />
  <text class="small" x="450" y="240">and again: new assets, new threats, new incidents</text>

  <text class="green" x="450" y="300">risk = likelihood × impact</text>
</svg>
