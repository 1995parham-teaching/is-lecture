<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360">
  <title>The grade service as zones, with an enforcement point at each boundary</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
    .title { font-size: 22px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="15" y="60" width="170" height="130" rx="6" style="stroke: #ff5252" />
  <text class="red title" x="100" y="95">Users</text>
  <text x="100" y="130">students,</text>
  <text x="100" y="155">instructor</text>

  <rect class="box" x="245" y="60" width="170" height="130" rx="6" style="stroke: #ff9100" />
  <text class="orange title" x="330" y="95">Login layer</text>
  <text x="330" y="130">sets</text>
  <text class="mono" x="330" y="155">X-User</text>

  <rect class="box" x="475" y="60" width="170" height="130" rx="6" style="stroke: #76ff03" />
  <text class="green title" x="560" y="95">Grade</text>
  <text class="green title" x="560" y="122">application</text>
  <text class="mono" x="560" y="157">setGrade</text>

  <rect class="box" x="705" y="60" width="180" height="130" rx="6" style="stroke: #00e5ff" />
  <text class="cyan title" x="795" y="95">Grade store</text>
  <text class="mono" x="795" y="135">grades</text>
  <text class="mono" x="795" y="160">server.log</text>

  <path class="line" d="M185,125 L243,125" />
  <path class="line" d="M415,125 L473,125" />
  <path class="line" d="M645,125 L703,125" />

  <line x1="215" y1="40" x2="215" y2="215" stroke="#ffcc00" stroke-width="5" />
  <line x1="445" y1="40" x2="445" y2="215" stroke="#ffcc00" stroke-width="5" />
  <line x1="675" y1="40" x2="675" y2="215" stroke="#ffcc00" stroke-width="5" />
  <text class="yellow small" x="450" y="20">yellow: a boundary, where trust changes</text>

  <text class="yellow" x="215" y="250">1 · authenticate</text>
  <text class="small" x="215" y="278">who are you?</text>
  <text class="yellow" x="445" y="250">2 · authorize</text>
  <text class="small" x="445" y="278">may you write this grade?</text>
  <text class="yellow" x="675" y="250">3 · record</text>
  <text class="small" x="675" y="278">log every decision</text>

  <text class="small" x="450" y="330">one enforcement point for each permitted path across a boundary</text>
</svg>
