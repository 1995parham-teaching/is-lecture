<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330">
  <title>NIST SP 800-61 incident response lifecycle</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
    .title { font-size: 22px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="10" y="60" width="190" height="120" rx="6" style="stroke: #76ff03" />
  <text class="green title" x="105" y="105">Preparation</text>
  <text class="small" x="105" y="145">the only phase</text>
  <text class="small" x="105" y="166">you can do today</text>

  <rect class="box" x="240" y="60" width="190" height="120" rx="6" style="stroke: #00e5ff" />
  <text class="cyan title" x="335" y="95">Detection</text>
  <text class="cyan title" x="335" y="122">and analysis</text>
  <text class="small" x="335" y="160">what happened?</text>

  <rect class="box" x="470" y="60" width="190" height="120" rx="6" style="stroke: #ff9100" />
  <text class="orange title" x="565" y="90">Containment,</text>
  <text class="orange title" x="565" y="116">eradication,</text>
  <text class="orange title" x="565" y="142">recovery</text>
  <text class="small" x="565" y="166">stop, remove, restore</text>

  <rect class="box" x="700" y="60" width="190" height="120" rx="6" style="stroke: #ee82ee" />
  <text class="violet title" x="795" y="105">Post-incident</text>
  <text class="violet title" x="795" y="132">activity</text>
  <text class="small" x="795" y="166">what let it happen?</text>

  <path class="line" d="M200,120 L238,120" />
  <path class="line" d="M430,100 L468,100" />
  <path class="line" d="M470,140 L432,140" />
  <path class="line" d="M660,120 L698,120" />
  <text class="yellow small" x="450" y="205">loop until it is contained</text>

  <path class="dash" d="M795,180 L795,250 L105,250 L105,182" />
  <text class="small" x="450" y="272">lessons improve the preparation for the next one</text>
  <text class="small" x="450" y="312">NIST SP 800-61</text>
</svg>
