<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360">
  <title>A pepper: a secret key kept outside the database, applied after the slow KDF</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; font-size: 18px; }
    .title { font-size: 20px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .zone { fill: none; stroke-width: 2; stroke-dasharray: 8 6; }
    .head { fill: rgba(255, 255, 255, 0.12); stroke: #cfd3da; stroke-width: 1.5; }
    .cell { fill: none; stroke: #cfd3da; stroke-width: 1.5; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <!-- the application server -->
  <rect class="box" x="150" y="20" width="600" height="78" rx="6" style="stroke: #ffcc00" />
  <text class="small" x="450" y="40">application server</text>
  <text class="mono" x="450" y="72"><tspan class="green">HMAC</tspan>(<tspan class="violet">pepper</tspan>, <tspan class="green">KDF</tspan>(<tspan class="orange">password</tspan>, <tspan class="cyan">salt</tspan>))</text>

  <path class="line" d="M300,98 V178" style="marker-start: url(#arrow)" />
  <text class="small" x="300" y="138" style="text-anchor: start" dx="10">salt, hash</text>
  <path class="line" d="M660,178 V100" />
  <text class="small" x="660" y="138" style="text-anchor: start" dx="10">pepper</text>

  <!-- the database -->
  <rect class="zone" x="20" y="180" width="420" height="120" rx="8" style="stroke: #ff5252" />
  <text class="title" x="230" y="204">database</text>
  <rect class="head" x="55" y="222" width="80" height="30" />
  <rect class="head" x="135" y="222" width="110" height="30" />
  <rect class="head" x="245" y="222" width="160" height="30" />
  <text x="95" y="238">user</text>
  <text class="cyan" x="190" y="238">salt</text>
  <text class="green" x="325" y="238">hash</text>
  <rect class="cell" x="55" y="252" width="80" height="34" />
  <rect class="cell" x="135" y="252" width="110" height="34" />
  <rect class="cell" x="245" y="252" width="160" height="34" />
  <text class="mono" x="95" y="270" style="font-size: 16px">4001</text>
  <text class="mono cyan" x="190" y="270" style="font-size: 16px">x7Q2…</text>
  <text class="mono green" x="325" y="270" style="font-size: 16px">c41a07…</text>

  <!-- the secret store -->
  <rect class="zone" x="480" y="180" width="400" height="120" rx="8" style="stroke: #76ff03" />
  <text class="title" x="680" y="204">secret store</text>
  <rect class="box" x="590" y="224" width="180" height="40" rx="6" style="stroke: #ee82ee" />
  <text class="violet" x="680" y="245">pepper: one key</text>
  <text class="small" x="680" y="283">HSM · KMS · vault — never the DB</text>

  <text class="red" x="230" y="324">a SQL-injection dump or a lost backup</text>
  <text class="red" x="230" y="348">takes only this half</text>
  <text class="green" x="680" y="324">without the pepper, no guess</text>
  <text class="green" x="680" y="348">can be checked offline</text>
</svg>
