<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330">
  <title>The same password hashed without a salt and with two different salts</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; font-size: 17px; }
    .title { font-size: 22px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text class="title" x="215" y="24">Unsalted SHA-256</text>
  <rect class="box" x="20" y="80" width="120" height="50" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="80" y="105">hunter2</text>
  <path class="line" d="M140,105 H246" />
  <text class="mono red" x="335" y="105">f52fbd32…</text>
  <rect class="box" x="20" y="170" width="120" height="50" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="80" y="195">hunter2</text>
  <path class="line" d="M140,195 H246" />
  <text class="mono red" x="335" y="195">f52fbd32…</text>
  <text class="red" x="215" y="260">the same digest, for everyone</text>
  <text class="small" x="215" y="288">compute it once, break it everywhere</text>

  <path class="dash" d="M450,10 V320" />

  <text class="title" x="680" y="24">Salted ($6$, SHA-512 crypt)</text>
  <rect class="box" x="475" y="70" width="190" height="70" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="570" y="92">hunter2</text>
  <text class="mono cyan" x="570" y="120">+ MrTqQCcV…</text>
  <path class="line" d="M665,105 H736" />
  <text class="mono green" x="815" y="105">rM65BZ4d…</text>
  <rect class="box" x="475" y="160" width="190" height="70" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="570" y="182">hunter2</text>
  <text class="mono cyan" x="570" y="210">+ 9kSX7tN9…</text>
  <path class="line" d="M665,195 H736" />
  <text class="mono green" x="815" y="195">g.pyl63t…</text>
  <text class="green" x="680" y="260">nothing alike</text>
  <text class="small" x="680" y="288">the salt is stored beside it, and is not secret</text>
</svg>
