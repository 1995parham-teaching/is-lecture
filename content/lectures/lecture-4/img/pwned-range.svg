<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330">
  <title>Pwned Passwords range query: only a five-character hash prefix leaves the server</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; font-size: 17px; }
    .title { font-size: 22px; font-weight: bold; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text class="title" x="160" y="22">your server</text>
  <text class="title" x="740" y="22">api.pwnedpasswords.com</text>

  <!-- 1. hash and split -->
  <rect class="box" x="20" y="50" width="280" height="80" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="160" y="72">SHA-1(hunter2)</text>
  <text class="mono" x="160" y="104"><tspan class="cyan">F3BBB</tspan><tspan class="green">D66A63D4BF17…</tspan></text>

  <!-- 2. send only the prefix -->
  <path class="line" d="M300,90 H598" />
  <text class="mono cyan" x="450" y="72">GET /range/F3BBB</text>
  <text class="small" x="450" y="110">5 hex characters, nothing else</text>

  <rect class="box" x="600" y="50" width="280" height="190" rx="6" style="stroke: #ffcc00" />
  <text x="740" y="90">every breached hash</text>
  <text x="740" y="116">starting with <tspan class="mono cyan">F3BBB</tspan></text>
  <text class="small" x="740" y="164">one of 1,048,576 ranges</text>
  <text class="small" x="740" y="188">1,998 suffixes, a count each</text>

  <!-- 3. the whole range comes back -->
  <path class="line" d="M600,222 H302" />
  <text class="mono small" x="450" y="204">002B8B…:21  00390A…:72  …</text>
  <text class="small" x="450" y="240">all 1,998 lines</text>

  <!-- 4. match locally -->
  <rect class="box" x="20" y="180" width="280" height="80" rx="6" style="stroke: #76ff03" />
  <text x="160" y="202">look for your suffix here</text>
  <text class="mono green" x="160" y="234">D66A63D4BF17…</text>
  <text class="red" x="160" y="288">found: seen 65,763 times</text>

  <path class="dash" d="M330,270 H880" style="stroke-dasharray: 4 6" />
  <text class="small" x="605" y="300">the API never learns which of the 1,998 you meant —</text>
  <text class="small" x="605" y="322">and never sees the password or its full hash</text>
</svg>
