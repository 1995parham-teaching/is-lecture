<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360">
  <title>Passive and active attacks</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .title { font-size: 24px; font-weight: bold; }
    .left { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .sep { stroke: #5a5f68; stroke-width: 1.5; stroke-dasharray: 4 6; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <!-- passive -->
  <text class="orange title" x="225" y="22">Passive — Eve listens</text>
  <rect class="box" x="20" y="70" width="100" height="50" rx="6" />
  <text x="70" y="95">Alice</text>
  <rect class="box" x="330" y="70" width="100" height="50" rx="6" />
  <text x="380" y="95">Bob</text>
  <path class="line" d="M120,95 H326" />
  <text class="small" x="225" y="80">the message arrives intact</text>
  <path class="dash" d="M225,97 V170" style="stroke: #ff9100" />
  <rect class="box" x="165" y="172" width="120" height="46" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="225" y="195">Eve</text>
  <text x="225" y="242"><tspan class="orange">release of contents</tspan> — reads it</text>
  <text x="225" y="270"><tspan class="orange">traffic analysis</tspan> — who, when, how much</text>
  <text class="small" x="225" y="298">nothing changes, nothing to notice</text>
  <text class="green" x="225" y="334">prevent it: encryption</text>

  <line class="sep" x1="450" y1="10" x2="450" y2="350" />

  <!-- active -->
  <text class="red title" x="675" y="22">Active — Mallory interferes</text>
  <rect class="box" x="465" y="70" width="90" height="50" rx="6" />
  <text x="510" y="95">Alice</text>
  <rect class="box" x="615" y="70" width="120" height="50" rx="6" style="stroke: #ff5252" />
  <text class="red" x="675" y="95">Mallory</text>
  <rect class="box" x="795" y="70" width="90" height="50" rx="6" />
  <text x="840" y="95">Bob</text>
  <path class="line" d="M555,95 H611" />
  <path class="line" d="M735,95 H791" />
  <text class="left" x="480" y="160"><tspan class="red">masquerade</tspan> — pretends to be Alice</text>
  <text class="left" x="480" y="192"><tspan class="red">replay</tspan> — sends an old message again</text>
  <text class="left" x="480" y="224"><tspan class="red">modification</tspan> — changes it on the way</text>
  <text class="left" x="480" y="256"><tspan class="red">denial of service</tspan> — blocks the line</text>
  <text class="small" x="675" y="294">something changed, so it can be seen</text>
  <text class="green" x="675" y="334">detect it, then recover</text>
</svg>
