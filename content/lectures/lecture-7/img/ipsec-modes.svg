<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <title>IPsec ESP in transport mode and in tunnel mode</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
    .title { font-size: 22px; font-weight: bold; }
    .left { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#76ff03" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5252" />
    </marker>
  </defs>
  <text class="title left" x="20" y="57">Original</text>
  <rect x="160" y="40" width="80" height="44" fill="rgba(255, 255, 255, 0.06)" stroke="#cfd3da" stroke-width="2" />
  <text class="small" x="200" y="62" style="fill: #eeeeee">IP</text>
  <rect x="240" y="40" width="80" height="44" fill="rgba(255, 255, 255, 0.06)" stroke="#cfd3da" stroke-width="2" />
  <text class="small" x="280" y="62" style="fill: #eeeeee">TCP</text>
  <rect x="320" y="40" width="200" height="44" fill="rgba(255, 255, 255, 0.06)" stroke="#cfd3da" stroke-width="2" />
  <text class="small" x="420" y="62" style="fill: #eeeeee">data</text>
  <text class="title left" x="20" y="182">Transport</text>
  <rect x="160" y="165" width="80" height="44" fill="rgba(255, 255, 255, 0.06)" stroke="#cfd3da" stroke-width="2" />
  <text class="small" x="200" y="187" style="fill: #eeeeee">IP</text>
  <rect x="240" y="165" width="80" height="44" fill="rgba(255, 204, 0, 0.10)" stroke="#ffcc00" stroke-width="2" />
  <text class="small" x="280" y="187" style="fill: #eeeeee">ESP</text>
  <rect x="320" y="165" width="80" height="44" fill="rgba(118, 255, 3, 0.14)" stroke="#cfd3da" stroke-width="2" />
  <text class="small" x="360" y="187" style="fill: #eeeeee">TCP</text>
  <rect x="400" y="165" width="200" height="44" fill="rgba(118, 255, 3, 0.14)" stroke="#cfd3da" stroke-width="2" />
  <text class="small" x="500" y="187" style="fill: #eeeeee">data</text>
  <rect x="600" y="165" width="110" height="44" fill="rgba(118, 255, 3, 0.14)" stroke="#cfd3da" stroke-width="2" />
  <text class="small" x="655" y="187" style="fill: #eeeeee">ESP trailer</text>
  <rect x="710" y="165" width="70" height="44" fill="rgba(255, 204, 0, 0.10)" stroke="#ffcc00" stroke-width="2" />
  <text class="small" x="745" y="187" style="fill: #eeeeee">ICV</text>
  <path d="M240,159 V153 H710 V159" fill="none" stroke="#00e5ff" stroke-width="2" />
  <text class="cyan small" x="475" y="141">authenticated</text>
  <path d="M320,215 V221 H710 V215" fill="none" stroke="#76ff03" stroke-width="2" />
  <text class="green small" x="515" y="235">encrypted</text>
  <text class="small left" x="20" y="252">original header stays visible — host to host</text>
  <text class="title left" x="20" y="337">Tunnel</text>
  <rect x="160" y="320" width="80" height="44" fill="rgba(255, 255, 255, 0.06)" stroke="#ff9100" stroke-width="2" />
  <text class="small" x="200" y="342" style="fill: #eeeeee">new IP</text>
  <rect x="240" y="320" width="80" height="44" fill="rgba(255, 204, 0, 0.10)" stroke="#ffcc00" stroke-width="2" />
  <text class="small" x="280" y="342" style="fill: #eeeeee">ESP</text>
  <rect x="320" y="320" width="70" height="44" fill="rgba(118, 255, 3, 0.14)" stroke="#cfd3da" stroke-width="2" />
  <text class="small" x="355" y="342" style="fill: #eeeeee">IP</text>
  <rect x="390" y="320" width="80" height="44" fill="rgba(118, 255, 3, 0.14)" stroke="#cfd3da" stroke-width="2" />
  <text class="small" x="430" y="342" style="fill: #eeeeee">TCP</text>
  <rect x="470" y="320" width="200" height="44" fill="rgba(118, 255, 3, 0.14)" stroke="#cfd3da" stroke-width="2" />
  <text class="small" x="570" y="342" style="fill: #eeeeee">data</text>
  <rect x="670" y="320" width="110" height="44" fill="rgba(118, 255, 3, 0.14)" stroke="#cfd3da" stroke-width="2" />
  <text class="small" x="725" y="342" style="fill: #eeeeee">ESP trailer</text>
  <rect x="780" y="320" width="70" height="44" fill="rgba(255, 204, 0, 0.10)" stroke="#ffcc00" stroke-width="2" />
  <text class="small" x="815" y="342" style="fill: #eeeeee">ICV</text>
  <path d="M240,314 V308 H780 V314" fill="none" stroke="#00e5ff" stroke-width="2" />
  <text class="cyan small" x="510" y="296">authenticated</text>
  <path d="M320,370 V376 H780 V370" fill="none" stroke="#76ff03" stroke-width="2" />
  <text class="green small" x="550" y="390">encrypted</text>
  <text class="small left" x="20" y="407">only the gateways' addresses are visible — gateway to gateway</text>
</svg>
