<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460">
  <title>ARP spoofing: one forged broadcast moves the victim's traffic through the attacker</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
    .title { font-size: 22px; font-weight: bold; }
    .left { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#76ff03" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5252" />
    </marker>
  </defs>
  <line x1="450" y1="10" x2="450" y2="395" stroke="#8d97a8" stroke-width="1" stroke-dasharray="4 6" />

  <!-- before -->
  <text class="title" x="225" y="24">Before</text>
  <rect class="box" x="20" y="50" width="210" height="64" rx="6" style="stroke: #00e5ff" />
  <text class="small" x="125" y="70">victim's ARP cache</text>
  <text class="mono" x="125" y="96">192.0.2.1 → …:01</text>
  <path class="dash" d="M90,114 V158" style="stroke: #00e5ff" />

  <rect class="box" x="20" y="160" width="140" height="64" rx="6" />
  <text x="90" y="182">victim</text>
  <text class="small" x="90" y="206">192.0.2.20</text>
  <rect class="box" x="285" y="160" width="150" height="64" rx="6" style="stroke: #76ff03" />
  <text x="360" y="182">gateway</text>
  <text class="small" x="360" y="206">192.0.2.1 · …:01</text>
  <path class="line" d="M160,192 H281" style="stroke: #76ff03; marker-end: url(#arrow-green)" />
  <text class="green small" x="223" y="176">traffic</text>

  <rect class="box" x="155" y="290" width="140" height="64" rx="6" style="stroke: #8d97a8" />
  <text x="225" y="312">attacker</text>
  <text class="small" x="225" y="336">192.0.2.66 · …:66</text>

  <!-- after -->
  <text class="title" x="675" y="24">After one forged broadcast</text>
  <rect class="box" x="470" y="50" width="210" height="64" rx="6" style="stroke: #ff5252" />
  <text class="small" x="575" y="70">victim's ARP cache</text>
  <text class="mono red" x="575" y="96">192.0.2.1 → …:66</text>
  <path class="dash" d="M540,114 V158" style="stroke: #ff5252" />

  <rect class="box" x="470" y="160" width="140" height="64" rx="6" />
  <text x="540" y="182">victim</text>
  <text class="small" x="540" y="206">192.0.2.20</text>
  <rect class="box" x="735" y="160" width="150" height="64" rx="6" />
  <text x="810" y="182">gateway</text>
  <text class="small" x="810" y="206">192.0.2.1 · …:01</text>

  <rect class="box" x="605" y="290" width="140" height="64" rx="6" style="stroke: #ff5252" />
  <text class="red" x="675" y="312">attacker</text>
  <text class="small" x="675" y="336">192.0.2.66 · …:66</text>
  <path class="line" d="M560,224 L635,286" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <path class="line" d="M715,286 L790,228" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <text class="red small" x="830" y="262">read, change,</text>
  <text class="red small" x="830" y="284">then forward</text>
  <path class="dash" d="M605,334 C525,334 500,290 515,228" style="stroke: #ff5252" />
  <text class="red small" x="600" y="378">forged: "192.0.2.1 is at …:66"</text>

  <text x="450" y="418">Nothing was decrypted or guessed. ARP believes whoever speaks last.</text>
  <text class="small" x="450" y="444">The gateway still works, so the victim sees no error at all.</text>
</svg>
