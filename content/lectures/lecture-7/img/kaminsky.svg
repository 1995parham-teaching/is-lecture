<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460">
  <title>The Kaminsky attack: a race on a fresh random name, won with a forged delegation</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
    .title { font-size: 22px; font-weight: bold; }
    .left { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5252" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00e5ff" />
    </marker>
  </defs>

  <!-- the three parties -->
  <rect class="box" x="40" y="12" width="200" height="50" rx="6" style="stroke: #ff5252" />
  <text class="red" x="140" y="37">attacker</text>
  <rect class="box" x="350" y="12" width="200" height="50" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="450" y="37">caching resolver</text>
  <rect class="box" x="660" y="12" width="200" height="50" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="760" y="37">ns.foo.com</text>
  <line x1="140" y1="62" x2="140" y2="340" stroke="#8d97a8" stroke-width="1" stroke-dasharray="4 6" />
  <line x1="450" y1="62" x2="450" y2="340" stroke="#8d97a8" stroke-width="1" stroke-dasharray="4 6" />
  <line x1="760" y1="62" x2="760" y2="340" stroke="#8d97a8" stroke-width="1" stroke-dasharray="4 6" />

  <!-- 1: a fresh name, so nothing is cached -->
  <path class="line" d="M140,95 H446" />
  <text class="mono" x="295" y="82">83.foo.com?</text>
  <text class="small" x="295" y="110">a random name: never cached</text>

  <!-- 2: the resolver asks the real server -->
  <path class="line" d="M450,140 H756" style="stroke: #00e5ff; marker-end: url(#arrow-cyan)" />
  <text class="mono cyan" x="605" y="127">83.foo.com? ID=?</text>

  <!-- 3: the flood of forged answers -->
  <path class="line" d="M140,190 H446" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <path class="line" d="M140,202 H446" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <path class="line" d="M140,214 H446" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <text class="mono red" x="295" y="174">ID 0 … 199, each:</text>
  <text class="mono" x="295" y="240">ask www.foo.com,</text>
  <text class="mono" x="295" y="262">it is at 203.0.113.66</text>

  <!-- 4: the real answer arrives second -->
  <path class="dash" d="M756,290 H454" style="marker-end: url(#arrow)" />
  <text class="small" x="605" y="276">the real answer, too late</text>

  <!-- the outcome -->
  <rect class="box" x="330" y="300" width="240" height="44" rx="6" style="stroke: #ff5252" />
  <text class="red" x="450" y="322">www.foo.com poisoned</text>

  <text class="small left" x="20" y="380">Lost the race? Ask 84.foo.com. The TTL only stops a second race on the same name.</text>
  <text class="green left" x="20" y="416">Fix: a random source port too, so the forger must guess about 32 bits, not 16.</text>
  <text class="green left" x="20" y="446">The real fix: DNSSEC, so a forged answer fails its signature check.</text>
</svg>
