<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <title>North-south and east-west traffic: a flat network against a microsegmented one</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
    .title { font-size: 22px; font-weight: bold; }
    .left { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#76ff03" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5252" />
    </marker>
  </defs>
  <text class="title" x="215" y="22">Flat inside the perimeter</text>
  <text class="small left" x="228" y="50">from the internet</text>
  <path class="line" d="M215,40 V120" style="stroke: #ff9100" />
  <line x1="70" y1="80" x2="360" y2="80" stroke="#ffcc00" stroke-width="5" />
  <text class="orange small" x="120" y="62">north-south</text>
  <rect x="15" y="100" width="400" height="270" rx="8" fill="none" stroke="#8d97a8" stroke-width="2" stroke-dasharray="6 5" />
  <rect class="box" x="30" y="140" width="165" height="56" rx="6" style="stroke: #ff5252" />
  <text class="red" x="112" y="168">phished laptop</text>
  <rect class="box" x="235" y="140" width="165" height="56" rx="6" style="stroke: #cfd3da" />
  <text x="318" y="168">file server</text>
  <rect class="box" x="30" y="290" width="165" height="56" rx="6" style="stroke: #cfd3da" />
  <text x="112" y="318">grade service</text>
  <rect class="box" x="235" y="290" width="165" height="56" rx="6" style="stroke: #cfd3da" />
  <text x="318" y="318">domain controller</text>
  <path class="line" d="M195,168 H231" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <path class="line" d="M318,196 V286" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <path class="line" d="M112,196 V286" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <text class="red small" x="215" y="243">east-west</text>
  <text class="red" x="215" y="392">one phish reaches everything</text>
  <line x1="450" y1="10" x2="450" y2="400" stroke="#8d97a8" stroke-width="1" stroke-dasharray="4 6" />
  <text class="title" x="685" y="22">Microsegmented</text>
  <text class="small left" x="698" y="50">from the internet</text>
  <path class="line" d="M685,40 V120" style="stroke: #ff9100" />
  <line x1="540" y1="80" x2="830" y2="80" stroke="#ffcc00" stroke-width="5" />
  <text class="orange small" x="590" y="62">north-south</text>
  <rect x="485" y="100" width="400" height="270" rx="8" fill="none" stroke="#8d97a8" stroke-width="2" stroke-dasharray="6 5" />
  <rect x="493" y="133" width="179" height="70" rx="8" fill="none" stroke="#ffcc00" stroke-width="2.5" />
  <rect class="box" x="500" y="140" width="165" height="56" rx="6" style="stroke: #ff5252" />
  <text class="red" x="582" y="168">phished laptop</text>
  <rect x="698" y="133" width="179" height="70" rx="8" fill="none" stroke="#ffcc00" stroke-width="2.5" />
  <rect class="box" x="705" y="140" width="165" height="56" rx="6" style="stroke: #cfd3da" />
  <text x="788" y="168">file server</text>
  <rect x="493" y="283" width="179" height="70" rx="8" fill="none" stroke="#ffcc00" stroke-width="2.5" />
  <rect class="box" x="500" y="290" width="165" height="56" rx="6" style="stroke: #cfd3da" />
  <text x="582" y="318">grade service</text>
  <rect x="698" y="283" width="179" height="70" rx="8" fill="none" stroke="#ffcc00" stroke-width="2.5" />
  <rect class="box" x="705" y="290" width="165" height="56" rx="6" style="stroke: #cfd3da" />
  <text x="788" y="318">domain controller</text>
  <path class="dash" d="M672,168 H698" style="stroke: #ff5252" />
  <text class="red title" x="685" y="146">✗</text>
  <path class="dash" d="M788,204 V282" style="stroke: #ff5252" />
  <text class="red title" x="806" y="243">✗</text>
  <path class="dash" d="M582,204 V282" style="stroke: #ff5252" />
  <text class="red title" x="600" y="243">✗</text>
  <text class="yellow" x="685" y="392">each workload is its own zone</text>
  <text class="small" x="450" y="428">Lateral movement: the walk from the first laptop to the domain controller.</text>
</svg>
