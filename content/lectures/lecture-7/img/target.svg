<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <title>The Target breach, 2013: from an HVAC vendor's password to card data leaving over FTP</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
    .title { font-size: 22px; font-weight: bold; }
    .left { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5252" />
    </marker>
  </defs>

  <!-- outside -->
  <text class="title" x="130" y="24">Outside</text>
  <rect class="box" x="20" y="60" width="220" height="80" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="130" y="88">HVAC vendor</text>
  <text class="small" x="130" y="116">phished: password stolen</text>
  <rect class="box" x="20" y="280" width="220" height="80" rx="6" style="stroke: #ff5252" />
  <text class="red" x="130" y="308">attacker's drop</text>
  <text class="small" x="130" y="336">an FTP server abroad</text>

  <!-- the perimeter -->
  <line x1="275" y1="40" x2="275" y2="390" stroke="#ffcc00" stroke-width="5" />
  <text class="yellow small" x="275" y="408">perimeter</text>

  <!-- inside, flat -->
  <text class="title" x="590" y="24">Inside Target: one flat network</text>
  <rect x="300" y="40" width="580" height="350" rx="8" fill="none" stroke="#8d97a8" stroke-width="2" stroke-dasharray="6 5" />
  <rect class="box" x="330" y="60" width="220" height="80" rx="6" style="stroke: #cfd3da" />
  <text x="440" y="88">vendor portal</text>
  <text class="small" x="440" y="116">billing, with a login</text>
  <rect class="box" x="640" y="60" width="220" height="80" rx="6" style="stroke: #ff5252" />
  <text class="red" x="750" y="88">POS terminals</text>
  <text class="small" x="750" y="116">RAM scraper on each</text>
  <rect class="box" x="640" y="280" width="220" height="80" rx="6" style="stroke: #cfd3da" />
  <text x="750" y="308">internal server</text>
  <text class="small" x="750" y="336">collects the card data</text>
  <rect class="box" x="330" y="280" width="220" height="80" rx="6" style="stroke: #cfd3da" />
  <text x="440" y="308">internal server</text>
  <text class="small" x="440" y="336">sends it out</text>

  <!-- the path -->
  <path class="line" d="M240,100 H326" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <text class="small" x="292" y="84">1</text>
  <path class="line" d="M550,100 H636" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <text class="small" x="594" y="84">2</text>
  <path class="line" d="M750,140 V276" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <text class="small left" x="760" y="208">3</text>
  <path class="line" d="M640,320 H554" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <text class="small" x="596" y="304">4</text>
  <path class="line" d="M330,320 H244" style="stroke: #ff5252; marker-end: url(#arrow-red)" />
  <text class="small" x="296" y="304">5</text>

  <!-- where it could have stopped -->
  <text class="green title" x="594" y="168">✗</text>
  <text class="green small" x="594" y="196">a zone wall here</text>
  <text class="green title" x="287" y="346">✗</text>
  <text class="green small left" x="310" y="376">an egress allowlist at 5</text>

  <text class="small" x="450" y="430">Step 2 is the one the Senate report could not reconstruct: how is not public, only that nothing stopped it.</text>
</svg>
