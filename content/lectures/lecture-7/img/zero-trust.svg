<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440">
  <title>Perimeter trust against zero trust: one check at the door, or a decision on every request</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
    .title { font-size: 22px; font-weight: bold; }
    .left { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#76ff03" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5252" />
    </marker>
  </defs>
  <!-- perimeter -->
  <text class="title" x="215" y="22">Perimeter: checked at the door</text>
  <rect class="box" x="140" y="48" width="150" height="50" rx="6" />
  <text x="215" y="73">user</text>
  <path class="line" d="M215,98 V140" />
  <rect x="20" y="150" width="390" height="230" rx="8" fill="none" stroke="#8d97a8" stroke-width="2" stroke-dasharray="6 5" />
  <rect x="190" y="140" width="50" height="20" rx="3" fill="#ffcc00" />
  <text class="yellow small left" x="250" y="125">one check, once</text>
  <path class="line" d="M215,165 L82,284" style="stroke: #76ff03; marker-end: url(#arrow-green)" />
  <path class="line" d="M215,165 V284" style="stroke: #76ff03; marker-end: url(#arrow-green)" />
  <path class="line" d="M215,165 L348,284" style="stroke: #76ff03; marker-end: url(#arrow-green)" />
  <text class="green small" x="120" y="215">inside = trusted</text>
  <rect class="box" x="30" y="290" width="115" height="56" rx="6" />
  <text class="small" x="87" y="318" style="fill: #eeeeee">grade service</text>
  <rect class="box" x="158" y="290" width="115" height="56" rx="6" />
  <text class="small" x="215" y="318" style="fill: #eeeeee">file server</text>
  <rect class="box" x="286" y="290" width="115" height="56" rx="6" />
  <text class="small" x="343" y="318" style="fill: #eeeeee">registrar DB</text>

  <line x1="450" y1="10" x2="450" y2="390" stroke="#8d97a8" stroke-width="1" stroke-dasharray="4 6" />

  <!-- zero trust -->
  <text class="title" x="675" y="22">Zero trust: decided per request</text>
  <rect class="box" x="490" y="48" width="160" height="50" rx="6" />
  <text x="570" y="73">user + device</text>
  <path class="line" d="M570,98 V146" />
  <text class="small left" x="580" y="122">one request</text>
  <rect class="box" x="490" y="150" width="160" height="60" rx="6" style="stroke: #ffcc00" />
  <text class="yellow" x="570" y="172">enforcement</text>
  <text class="yellow small" x="570" y="194">point</text>
  <path class="line" d="M650,170 H688" />
  <path class="line" d="M692,192 H654" style="stroke: #76ff03; marker-end: url(#arrow-green)" />
  <text class="green small" x="671" y="218">allow</text>
  <rect class="box" x="692" y="120" width="198" height="135" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="791" y="142">decision point</text>
  <text class="small" x="791" y="170">who is it, really?</text>
  <text class="small" x="791" y="192">is the device healthy?</text>
  <text class="small" x="791" y="214">may it do this, here?</text>
  <text class="small" x="791" y="236">is this unusual now?</text>
  <path class="line" d="M550,210 L532,284" style="stroke: #76ff03; marker-end: url(#arrow-green)" />
  <rect class="box" x="475" y="290" width="115" height="56" rx="6" style="stroke: #76ff03" />
  <text class="small" x="532" y="318" style="fill: #eeeeee">grade service</text>
  <rect class="box" x="603" y="290" width="115" height="56" rx="6" style="stroke: #8d97a8" />
  <text class="small" x="660" y="318">file server</text>
  <rect class="box" x="731" y="290" width="115" height="56" rx="6" style="stroke: #8d97a8" />
  <text class="small" x="788" y="318">registrar DB</text>
  <text class="small" x="660" y="370">no request, no path</text>

  <text x="450" y="420">Location is not a credential. Every request is decided on its own.</text>
</svg>
