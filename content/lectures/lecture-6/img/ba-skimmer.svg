<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350">
  <title>British Airways, 2018: the attacker edits a JavaScript file on britishairways.com; the payment page loads it, and it sends a copy of each card to BAways.com</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; font-size: 17px; }
    .title { font-size: 22px; font-weight: bold; }
    .start { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="20" y="30" width="300" height="110" rx="6" />
  <text class="title" x="170" y="60">britishairways.com</text>
  <text class="mono" x="170" y="94">a JavaScript file,</text>
  <text class="orange" x="170" y="120">edited</text>

  <rect class="box" x="600" y="30" width="280" height="110" rx="6" style="stroke: #ff5252" />
  <text class="red title" x="740" y="60">attacker</text>
  <text class="small" x="740" y="94">in through a contractor's</text>
  <text class="small" x="740" y="118">Citrix login, no MFA</text>

  <path class="dash" d="M600,85 H324" />
  <text class="small" x="462" y="68">edits the file on BA's server</text>

  <path class="line" d="M170,140 V206" />
  <text class="small start" x="186" y="174">the payment page loads it, from BA's own origin</text>

  <rect class="box" x="20" y="210" width="300" height="110" rx="6" style="stroke: #00e5ff" />
  <text class="cyan title" x="170" y="240">customer's browser</text>
  <text class="small" x="170" y="272">the booking goes through</text>
  <text class="mono" x="170" y="298">card number, CVV</text>

  <rect class="box" x="600" y="210" width="280" height="110" rx="6" style="stroke: #ff5252" />
  <text class="mono red" x="740" y="245">BAways.com</text>
  <text class="small" x="740" y="278">a lookalike domain</text>
  <text class="small" x="740" y="300">the attacker controls</text>

  <path class="line" d="M320,265 H596" />
  <text class="mono" x="460" y="248">POST a copy</text>
  <text class="small green" x="460" y="288">a CSP allow-list would</text>
  <text class="small green" x="460" y="310">refuse this host</text>
</svg>
