<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340">
  <title>Capital One, 2019: a misconfigured web application firewall relays a request to the metadata service, which returns the firewall role's credentials; the attacker uses them to list and copy S3 buckets</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; font-size: 17px; }
    .title { font-size: 22px; font-weight: bold; }
    .start { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect x="300" y="20" width="590" height="310" rx="10" fill="none" stroke="#8d97a8" stroke-width="2" stroke-dasharray="3 5" />
  <text class="small start" x="316" y="40">inside Capital One's cloud account</text>

  <rect class="box" x="20" y="60" width="170" height="100" rx="6" style="stroke: #ff5252" />
  <text class="red title" x="105" y="92">attacker</text>
  <text class="small" x="105" y="126">on the internet</text>

  <rect class="box" x="330" y="60" width="240" height="100" rx="6" style="stroke: #ff9100" />
  <text class="orange title" x="450" y="88">WAF on EC2</text>
  <text class="small" x="450" y="118">misconfigured: it relays</text>
  <text class="small" x="450" y="140">requests inward</text>

  <rect class="box" x="690" y="60" width="185" height="100" rx="6" />
  <text class="mono" x="782" y="88">169.254.169.254</text>
  <text class="small" x="782" y="118">metadata service:</text>
  <text class="small" x="782" y="140">answers anyone inside</text>

  <path class="line" d="M190,110 H326" />
  <text class="small" x="242" y="94">1  request</text>
  <path class="line" d="M570,110 H686" />
  <text class="small" x="628" y="94">2  relayed</text>

  <path class="dash" d="M782,160 V200 H140 V164" />
  <text class="small" x="460" y="220">3  temporary credentials for the WAF's role, back to the attacker</text>

  <path class="line" d="M60,160 V290 H326" />
  <text class="small" x="190" y="272">4  list, then copy</text>

  <rect class="box" x="330" y="245" width="240" height="75" rx="6" style="stroke: #00e5ff" />
  <text class="cyan title" x="450" y="270">S3 buckets</text>
  <text class="small" x="450" y="300">the role could read them all</text>

  <path class="line" d="M570,282 H616" />
  <text x="748" y="270" style="font-size: 18px">about 100 million people</text>
  <text x="748" y="300" style="font-size: 18px">in the US, 6 million in Canada</text>
</svg>
