<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 385">
  <title>Stored, reflected and DOM-based XSS as three request flows</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; font-size: 17px; }
    .title { font-size: 22px; font-weight: bold; }
    .start { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text class="red title" x="62" y="60">Stored</text>
  <rect class="box" x="135" y="20" width="150" height="80" rx="6" style="stroke: #cfd3da" />
  <text x="210" y="48">attacker</text>
  <text class="small" x="210" y="76">posts a comment</text>
  <rect class="box" x="321" y="20" width="150" height="80" rx="6" style="stroke: #ff9100" />
  <text x="396" y="48">server</text>
  <text class="small" x="396" y="76">stores it</text>
  <rect class="box" x="507" y="20" width="150" height="80" rx="6" style="stroke: #cfd3da" />
  <text x="582" y="48">every visitor</text>
  <text class="small" x="582" y="76">loads the page</text>
  <rect class="box" x="693" y="20" width="150" height="80" rx="6" style="stroke: #ff5252" />
  <text x="768" y="48">script runs</text>
  <text class="small" x="768" y="76">in each session</text>
  <path class="line" d="M285,60 H317" />
  <path class="line" d="M471,60 H503" />
  <path class="line" d="M657,60 H689" />
  <text class="orange title" x="62" y="180">Reflected</text>
  <rect class="box" x="135" y="140" width="150" height="80" rx="6" style="stroke: #cfd3da" />
  <text x="210" y="168">attacker</text>
  <text class="small" x="210" y="196">sends a link</text>
  <rect class="box" x="321" y="140" width="150" height="80" rx="6" style="stroke: #cfd3da" />
  <text x="396" y="168">victim</text>
  <text class="small" x="396" y="196">clicks it</text>
  <rect class="box" x="507" y="140" width="150" height="80" rx="6" style="stroke: #ff9100" />
  <text x="582" y="168">server</text>
  <text class="small" x="582" y="196">echoes ?q= back</text>
  <rect class="box" x="693" y="140" width="150" height="80" rx="6" style="stroke: #ff5252" />
  <text x="768" y="168">script runs</text>
  <text class="small" x="768" y="196">for that victim</text>
  <path class="line" d="M285,180 H317" />
  <path class="line" d="M471,180 H503" />
  <path class="line" d="M657,180 H689" />
  <text class="yellow title" x="62" y="300">DOM</text>
  <rect class="box" x="135" y="260" width="150" height="80" rx="6" style="stroke: #cfd3da" />
  <text x="210" y="288">attacker</text>
  <text class="small" x="210" y="316">sends a link</text>
  <rect class="box" x="321" y="260" width="150" height="80" rx="6" style="stroke: #cfd3da" />
  <text x="396" y="288">victim</text>
  <text class="small" x="396" y="316">clicks it</text>
  <rect class="box" x="507" y="260" width="150" height="80" rx="6" style="stroke: #00e5ff" />
  <text x="582" y="288">page script</text>
  <text class="small" x="582" y="316">innerHTML = #…</text>
  <rect class="box" x="693" y="260" width="150" height="80" rx="6" style="stroke: #ff5252" />
  <text x="768" y="288">script runs</text>
  <text class="small" x="768" y="316">server saw nothing</text>
  <path class="line" d="M285,300 H317" />
  <path class="line" d="M471,300 H503" />
  <path class="line" d="M657,300 H689" />
  <text class="small" x="490" y="370">orange: the server takes part · cyan: the server never sees the #fragment</text>
</svg>
