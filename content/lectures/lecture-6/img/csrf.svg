<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <title>CSRF against the grade service: a page on another site makes the instructor's browser send a grade change with the session cookie attached</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; font-size: 17px; }
    .title { font-size: 22px; font-weight: bold; }
    .start { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect x="20" y="30" width="540" height="350" rx="10" fill="none" stroke="#8d97a8" stroke-width="2" stroke-dasharray="3 5" />
  <text class="small start" x="36" y="52">the instructor's browser, logged in to grades.example</text>

  <rect class="box" x="45" y="75" width="270" height="120" rx="6" style="stroke: #ff5252" />
  <text class="red title" x="180" y="102">tab: evil.example</text>
  <text class="mono" x="180" y="138" style="font-size: 15px">&lt;form action=".../grade"&gt;</text>
  <text class="small" x="180" y="170">submits itself on page load</text>

  <rect class="box" x="45" y="245" width="270" height="100" rx="6" style="stroke: #ee82ee" />
  <text class="violet title" x="180" y="272">cookie jar</text>
  <text class="mono" x="180" y="302">__Host-session=…</text>
  <text class="small" x="180" y="328">for grades.example, no SameSite</text>

  <path class="line" d="M315,135 H616" />
  <text class="mono" x="465" y="118">POST /grade</text>
  <text class="mono" x="465" y="158">id=4001&amp;grade=20</text>
  <path class="dash" d="M315,295 H400 V180 H616" />
  <text class="small start" x="335" y="318">the browser attaches it,</text>
  <text class="small start" x="335" y="340">because the request goes</text>
  <text class="small start" x="335" y="362">to grades.example</text>

  <rect class="box" x="620" y="75" width="260" height="200" rx="6" />
  <text class="title" x="750" y="102">grades.example</text>
  <text x="750" y="140">session → parham</text>
  <text x="750" y="172"><tspan class="green">role: instructor ✓</tspan></text>
  <text class="red" x="750" y="206">4001 is now 20</text>
  <text class="small" x="750" y="244">every check passed</text>

  <text class="small" x="750" y="310">the attacker never sees the reply —</text>
  <text class="small" x="750" y="334">and does not need to</text>
</svg>
