<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <title>Two victims: server-side attacks hit your machine, client-side attacks hit your users</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; font-size: 17px; }
    .title { font-size: 22px; font-weight: bold; }
    .start { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="20" y="150" width="160" height="80" rx="6" style="stroke: #ff5252" />
  <text class="red title" x="100" y="178">attacker</text>
  <text class="small" x="100" y="206">any request</text>
  <path class="line" d="M180,190 H316" />

  <rect class="box" x="320" y="130" width="220" height="120" rx="6" />
  <text class="title" x="430" y="168">your web app</text>
  <text class="mono" x="430" y="200">grades.example</text>
  <text class="small" x="430" y="226">one origin</text>

  <path class="line" d="M540,160 H590 V85 H646" />
  <rect class="box" x="650" y="30" width="230" height="110" rx="6" style="stroke: #ff9100" />
  <text class="orange title" x="765" y="58">Server-side</text>
  <text x="765" y="88">victim: your machine</text>
  <text class="small" x="765" y="116">database, files, internal net</text>

  <path class="line" d="M540,220 H590 V295 H646" />
  <rect class="box" x="650" y="240" width="230" height="110" rx="6" style="stroke: #00e5ff" />
  <text class="cyan title" x="765" y="268">Client-side</text>
  <text x="765" y="298">victim: your users</text>
  <text class="small" x="765" y="326">their session, their data</text>

  <path class="dash" d="M100,230 V380 H765 V354" />
  <text class="small" x="430" y="366">or a link, an email, a page on evil.example — the browser does the rest</text>
</svg>
