<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430">
  <title>The TLS 1.3 handshake: one round trip, Diffie–Hellman key shares in the clear, everything after ServerHello encrypted</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; font-size: 17px; }
    .title { font-size: 22px; font-weight: bold; }
    .start { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <text class="title" x="200" y="22">client</text>
  <text class="title" x="700" y="22">grades.example</text>
  <path d="M200,40 V420 M700,40 V420" stroke="#8d97a8" stroke-width="2" />

  <path class="line" d="M200,70 H696" />
  <text class="yellow" x="450" y="56">ClientHello: suites, key share g<tspan dy="-7" font-size="14">a</tspan></text>
  <text class="small" x="450" y="88">in the clear — the hostname lecture 1 read off the wire</text>

  <path class="line" d="M700,130 H204" />
  <text class="yellow" x="450" y="116">ServerHello: chosen suite, key share g<tspan dy="-7" font-size="14">b</tspan></text>

  <rect x="210" y="150" width="480" height="40" rx="6" fill="rgba(118, 255, 3, 0.10)" stroke="#76ff03" stroke-width="1.5" />
  <text class="green" xml:space="preserve" x="450" y="171">both sides now hold g<tspan dy="-7" font-size="14">ab</tspan><tspan dy="7"> — Diffie–Hellman, lecture 3</tspan></text>

  <path class="line" d="M700,235 H204" />
  <text class="cyan" x="450" y="221">{ Certificate, CertificateVerify, Finished }</text>
  <text class="small" x="450" y="253">a signature over this handshake, by the key the certificate names</text>

  <path class="line" d="M200,300 H696" />
  <text class="cyan" x="450" y="286">{ Finished }</text>
  <text class="small" x="450" y="318">and the request may follow at once</text>

  <path class="line" d="M200,365 H696" />
  <text class="green" x="450" y="351">{ POST /login  name=…&amp;password=… }</text>
  <text class="small" x="450" y="383">the first request: the password is now inside the tunnel</text>

  <path d="M120,70 H100 V235 H120" stroke="#ff9100" stroke-width="2" fill="none" />
  <text class="orange" x="60" y="128">one</text>
  <text class="orange" x="60" y="152">round</text>
  <text class="orange" x="60" y="176">trip</text>
  <text class="small" x="450" y="414">{ … } = encrypted with keys derived from g<tspan dy="-6" font-size="12">ab</tspan></text>
</svg>
