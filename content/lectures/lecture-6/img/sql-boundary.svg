<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380">
  <title>Concatenation loses the boundary between code and data; a prepared statement keeps it</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; font-size: 17px; }
    .title { font-size: 22px; font-weight: bold; }
    .start { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect x="120" y="17" width="14" height="14" fill="#76ff03" />
  <text class="small start" x="142" y="24">code, written by you</text>
  <rect x="340" y="17" width="14" height="14" fill="#ffcc00" />
  <text class="small start" x="362" y="24">data, sent by the student</text>
  <rect x="580" y="17" width="14" height="14" fill="#ff5252" />
  <text class="small start" x="602" y="24">data the parser read as code</text>

  <text class="orange title start" x="20" y="75">Glued</text>
  <text class="mono start" xml:space="preserve" x="120" y="75"><tspan class="green">… WHERE student = '</tspan><tspan class="yellow">4001</tspan><tspan class="green">' AND course = '</tspan><tspan class="yellow">x' OR '1'='1</tspan><tspan class="green">'</tspan></text>
  <text class="small start" x="120" y="103">one string — by now nothing records which characters came from whom</text>

  <text class="orange title start" x="20" y="155">Parsed</text>
  <text class="mono start" xml:space="preserve" x="120" y="155"><tspan class="green">… WHERE student = </tspan><tspan class="yellow">'4001'</tspan><tspan class="green"> AND course = </tspan><tspan class="yellow">'x'</tspan><tspan class="red"> OR '1'='1'</tspan></text>
  <text class="mono start" xml:space="preserve" x="120" y="190">(student = '4001' AND course = 'x') <tspan class="red">OR true</tspan>  →  <tspan class="red">every row</tspan></text>

  <path d="M20,228 H880" stroke="#8d97a8" stroke-width="1" stroke-dasharray="4 6" />

  <text class="green title start" x="20" y="280">Prepared</text>
  <rect class="box" x="140" y="250" width="370" height="60" rx="6" style="stroke: #76ff03" />
  <text class="mono" xml:space="preserve" x="325" y="280"><tspan class="green">… WHERE student = ? AND course = ?</tspan></text>
  <rect class="box" x="560" y="250" width="320" height="60" rx="6" style="stroke: #ffcc00" />
  <text class="mono" xml:space="preserve" x="720" y="280"><tspan class="yellow">"4001"</tspan>,  <tspan class="yellow">"x' OR '1'='1"</tspan></text>
  <text class="small" x="325" y="330">parsed once, holes and all</text>
  <text class="small" x="720" y="330">sent separately, never parsed</text>
  <text x="450" y="364">no course is called <tspan class="yellow">x' OR '1'='1</tspan>  →  no rows</text>
</svg>
