<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <title>When the browser attaches a cookie: same-site always; cross-site depends on SameSite Strict, Lax or None</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Monaco, "Courier New", monospace; font-size: 17px; }
    .title { font-size: 22px; font-weight: bold; }
    .start { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>
  <rect class="box" x="250" y="20" width="400" height="64" rx="6" />
  <text x="450" y="44">Does the request come from</text>
  <text x="450" y="68">a page on another site?</text>
  <path class="line" d="M250,52 H186" />
  <text class="small" x="218" y="38">no</text>
  <rect class="box" x="20" y="22" width="162" height="60" rx="6" style="stroke: #76ff03" />
  <text class="green" x="101" y="52">cookie sent</text>

  <path class="line" d="M450,84 V112" />
  <text class="small start" x="460" y="100">yes — read the cookie's SameSite</text>
  <path class="line" d="M150,140 V166" />
  <path class="line" d="M450,140 V166" />
  <path class="line" d="M750,140 V166" />
  <path d="M150,140 H750 M450,116 V140" stroke="#cfd3da" stroke-width="2" fill="none" />

  <rect class="box" x="45" y="170" width="210" height="110" rx="6" style="stroke: #ff5252" />
  <text class="red title" x="150" y="198">Strict</text>
  <text x="150" y="232">never sent</text>
  <text class="small" x="150" y="260">not even for a clicked link</text>

  <rect class="box" x="345" y="170" width="210" height="110" rx="6" style="stroke: #ffcc00" />
  <text class="yellow title" x="450" y="198">Lax</text>
  <text x="450" y="232">sent for a top-level</text>
  <text x="450" y="258">GET: a clicked link</text>

  <rect class="box" x="645" y="170" width="210" height="110" rx="6" style="stroke: #ff9100" />
  <text class="orange title" x="750" y="198">None</text>
  <text x="750" y="232">always sent</text>
  <text class="small" x="750" y="260">and must also be Secure</text>

  <path d="M20,312 H880" stroke="#8d97a8" stroke-width="1" stroke-dasharray="4 6" />
  <text class="small" x="450" y="336">the form on evil.example is a cross-site POST:</text>
  <text class="green title" x="150" y="380">blocked</text>
  <text class="green title" x="450" y="380">blocked</text>
  <text class="red title" x="750" y="380">grade changed</text>
  <text class="small" x="450" y="408">the grade service's cookie says Lax</text>
</svg>
