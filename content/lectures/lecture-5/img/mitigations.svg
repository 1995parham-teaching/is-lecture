<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450">
  <title>A stack frame and the mitigation that guards each part of it</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .left { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff5252" />
    </marker>
  </defs>

  <text class="small" x="230" y="18">higher addresses</text>
  <rect class="box" x="110" y="34" width="240" height="44" rx="4" style="stroke: #8d97a8; stroke-dasharray: 6 5" />
  <text class="small" x="230" y="57">caller's frame</text>
  <rect class="box" x="110" y="80" width="240" height="50" rx="4" style="stroke: #ff5252" />
  <text class="red" x="230" y="106">return address</text>
  <rect class="box" x="110" y="132" width="240" height="44" rx="4" />
  <text x="230" y="155">saved frame pointer</text>
  <rect class="box" x="110" y="178" width="240" height="44" rx="4" style="stroke: #76ff03" />
  <text class="green" x="230" y="201">canary</text>
  <rect class="box" x="110" y="224" width="240" height="44" rx="4" style="stroke: #ff9100" />
  <text class="orange" x="230" y="247">is_admin</text>
  <rect class="box" x="110" y="270" width="240" height="80" rx="4" style="stroke: #00e5ff" />
  <text class="cyan" x="230" y="310">name[16]</text>
  <text class="small" x="230" y="370">struct session s</text>

  <path class="line" d="M80,340 V92" style="stroke: #ff5252" />
  <text class="red" x="60" y="216" transform="rotate(-90 60 216)">strcpy writes upward</text>

  <path class="dash" d="M362,106 H388" />
  <text class="cyan left" x="430" y="94">ASLR — no known address to put here</text>
  <text class="violet left" x="430" y="120">CFI — the jump must land on a real target</text>
  <path class="dash" d="M362,201 H388" />
  <text class="green left" x="430" y="201">Canary — changed? abort before return (exit=134)</text>
  <path class="dash" d="M362,310 H388" />
  <text class="cyan left" x="430" y="298">FORTIFY — __strcpy_chk knows name is 16 bytes</text>
  <text class="small left" x="430" y="324">it stops the copy itself (exit=133)</text>

  <path d="M396,80 H408 V370 H420" fill="none" stroke="#76ff03" stroke-width="2" />
  <text class="green left" x="430" y="370">NX — the stack is writable, so it is not executable</text>

  <text class="small" x="450" y="420">simplified: the exact layout depends on the compiler and the CPU</text>
</svg>
