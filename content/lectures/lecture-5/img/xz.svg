<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <title>The xz backdoor: from a trusted maintainer account to sshd</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
    .left { text-anchor: start; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8d97a8; stroke-width: 2; stroke-dasharray: 6 5; }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <text class="yellow left" x="10" y="20">upstream</text>
  <rect class="box" x="20" y="40" width="250" height="76" rx="6" style="stroke: #ffcc00" />
  <text x="145" y="66">"Jia Tan"</text>
  <text class="small" x="145" y="94">contributor 2021, maintainer 2022</text>
  <path class="line" d="M270,78 H318" />
  <rect class="box" x="320" y="40" width="260" height="76" rx="6" style="stroke: #ff5252" />
  <text x="450" y="66">release tarball</text>
  <text class="small" x="450" y="94">5.6.0 · 5.6.1, build script not in git</text>
  <path class="line" d="M580,78 H628" />
  <rect class="box" x="630" y="40" width="250" height="76" rx="6" />
  <text x="755" y="66">distro package build</text>
  <text class="small" x="755" y="94">x86-64 Linux, deb / rpm</text>

  <path class="line" d="M755,116 V188" />
  <text class="small" x="740" y="152" style="text-anchor: end">payload hidden in "test" files</text>

  <path class="dash" d="M10,172 H890 V330 H10 Z" style="stroke: #ff9100" />
  <text class="orange left" x="20" y="194">sshd's TCB: every library it loads</text>

  <rect class="box" x="630" y="210" width="250" height="76" rx="6" style="stroke: #ff5252" />
  <text class="mono" x="755" y="236">liblzma</text>
  <text class="small" x="755" y="264">compression, backdoored</text>
  <path class="line" d="M630,248 H582" />
  <rect class="box" x="320" y="210" width="260" height="76" rx="6" />
  <text class="mono" x="450" y="236">libsystemd</text>
  <text class="small" x="450" y="264">a distro patch adds it to sshd</text>
  <path class="line" d="M320,248 H272" />
  <rect class="box" x="20" y="210" width="250" height="76" rx="6" style="stroke: #00e5ff" />
  <text class="mono cyan" x="145" y="236">sshd</text>
  <text class="small" x="145" y="264">root, before any login</text>
  <text class="small" x="450" y="310">loaded at start-up, the code rewires a function sshd uses to check a public key</text>

  <text class="green" x="450" y="366">found by Andres Freund, March 2024: a failed login took ≈ 0.8 s, not ≈ 0.3 s</text>
  <text class="small" x="450" y="396">sshd never calls xz — it was in the TCB anyway</text>
</svg>
