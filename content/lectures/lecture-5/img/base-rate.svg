<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420">
  <title>The base-rate fallacy, counted: one day of events through a 99% detector</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <rect class="box" x="300" y="10" width="300" height="50" rx="6" />
  <text x="450" y="35">1,000,000 events / day</text>

  <path class="line" d="M400,60 L250,108" />
  <path class="line" d="M500,60 L650,108" />
  <text class="small" x="285" y="74">0.01%</text>
  <text class="small" x="615" y="74">99.99%</text>

  <rect class="box" x="150" y="110" width="200" height="46" rx="6" style="stroke: #ff9100" />
  <text class="orange" x="250" y="133">100 attacks</text>
  <rect class="box" x="550" y="110" width="200" height="46" rx="6" style="stroke: #00e5ff" />
  <text class="cyan" x="650" y="133">999,900 normal</text>

  <path class="line" d="M215,156 L150,204" />
  <path class="line" d="M285,156 L340,204" />
  <text class="small" x="155" y="174">99%</text>
  <text class="small" x="338" y="166">1%</text>
  <path class="line" d="M615,156 L560,204" />
  <path class="line" d="M685,156 L760,204" />
  <text class="small" x="555" y="174">0.1%</text>
  <text class="small" x="765" y="174">99.9%</text>

  <text class="green" x="140" y="222">99 alarms</text>
  <text class="small" x="350" y="222">1 missed</text>
  <text class="red" x="555" y="222">≈ 1,000 alarms</text>
  <text class="small" x="770" y="222">≈ 998,900 quiet</text>

  <text class="small" x="450" y="272">every alarm of the day, to scale</text>
  <rect x="50" y="292" width="72" height="50" fill="#76ff03" fill-opacity="0.35" stroke="#76ff03" stroke-width="2" />
  <rect x="122" y="292" width="728" height="50" fill="#ff5252" fill-opacity="0.25" stroke="#ff5252" stroke-width="2" />
  <text class="green" x="86" y="317">99</text>
  <text class="red" x="486" y="317">≈ 1,000 false alarms</text>

  <text x="450" y="384">P(attack | alarm) = 99 / 1,099 = <tspan class="red">9.01%</tspan></text>
</svg>
