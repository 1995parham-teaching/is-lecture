<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <title>Heartbleed: a heartbeat that claims 65,535 bytes and carries one</title>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 20px; fill: #eeeeee; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 16px; fill: #b0b4bc; }
    .mono { font-family: Menlo, Consolas, monospace; font-size: 16px; }
    .left { text-anchor: start; } .end { text-anchor: end; }
    .box { fill: rgba(255, 255, 255, 0.06); stroke: #cfd3da; stroke-width: 2; }
    .line { fill: none; stroke: #cfd3da; stroke-width: 2; marker-end: url(#arrow); }
    .orange { fill: #ff9100; } .green { fill: #76ff03; } .cyan { fill: #00e5ff; }
    .red { fill: #ff5252; } .violet { fill: #ee82ee; } .yellow { fill: #ffcc00; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cfd3da" />
    </marker>
  </defs>

  <!-- the request -->
  <text class="end" x="150" y="60">request</text>
  <rect class="box" x="170" y="35" width="170" height="50" rx="5" />
  <text class="mono" x="255" y="60">heartbeat</text>
  <rect class="box" x="340" y="35" width="200" height="50" rx="5" style="stroke: #ff5252" />
  <text class="mono red" x="440" y="60">length = 65535</text>
  <rect class="box" x="540" y="35" width="60" height="50" rx="5" style="stroke: #76ff03" />
  <text class="mono green" x="570" y="60">A</text>
  <text class="small left" x="615" y="50">the client's claim,</text>
  <text class="small left" x="615" y="72">and the one byte it sent</text>

  <!-- server memory -->
  <text class="end" x="150" y="175">server heap</text>
  <rect class="box" x="170" y="150" width="60" height="50" style="stroke: #76ff03" />
  <text class="mono green" x="200" y="175">A</text>
  <rect class="box" x="230" y="150" width="150" height="50" style="stroke: #ff9100" />
  <text class="orange" x="305" y="175">private key</text>
  <rect class="box" x="380" y="150" width="150" height="50" style="stroke: #ff9100" />
  <text class="orange" x="455" y="175">password</text>
  <rect class="box" x="530" y="150" width="150" height="50" style="stroke: #ff9100" />
  <text class="orange" x="605" y="175">cookie</text>
  <rect class="box" x="680" y="150" width="150" height="50" style="stroke: #ff9100" />
  <text class="orange" x="755" y="175">…</text>
  <path d="M170,128 V118 H830 V128" fill="none" stroke="#ff5252" stroke-width="2" />
  <text class="mono red" x="500" y="104">memcpy(reply, payload, 65535)</text>
  <path d="M230,222 V232 H830 V222" fill="none" stroke="#b0b4bc" stroke-width="1.5" />
  <text class="small" x="530" y="248">never sent by the client: whatever lay next in memory</text>

  <!-- the reply -->
  <path class="line" d="M500,262 V292" />
  <text class="end" x="150" y="325">reply</text>
  <rect class="box" x="170" y="300" width="60" height="50" rx="5" style="stroke: #76ff03" />
  <text class="mono green" x="200" y="325">A</text>
  <rect class="box" x="230" y="300" width="600" height="50" rx="5" style="stroke: #ff5252" />
  <text class="red" x="530" y="325">+ 65,534 bytes of the server's memory</text>

  <text class="small" x="450" y="384">a read, not a write: no canary changes, nothing crashes, and the server logs nothing unusual</text>
</svg>
